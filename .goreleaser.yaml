# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: hax

before:
  hooks:
    - go mod tidy -diff
    - go test ./...

builds:
  - &hax-build
    id: hax
    main: ./cmd/hax
    binary: hax
    env:
      - CGO_ENABLED=0
    goos: [linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    # Reproducible builds: strip paths, no VCS-dependent timestamps.
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - >-
        -s -w -buildid=
        -X github.com/BTCBap/hax/internal/version.Version={{ .Version }}
        -X github.com/BTCBap/hax/internal/version.Prerelease={{ .Prerelease }}
        -X github.com/BTCBap/hax/internal/version.GitCommit={{ .ShortCommit }}
        -X github.com/BTCBap/hax/internal/version.GitBranch={{ .Branch }}
        -X github.com/BTCBap/hax/internal/version.BuildDate={{ .CommitDate }}
  # Separate build ID so only macOS archives get Hax.app.
  - <<: *hax-build
    id: hax-darwin
    goos: [darwin]
    ignore: []

archives:
  # Linux and Windows archives keep the existing names and contents.
  - id: default
    ids: [hax]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - SECURITY.md
  # macOS archives also ship the unsigned Hax.app launcher next to hax.
  - id: macos
    ids: [hax-darwin]
    formats: [tar.gz]
    files:
      - README.md
      - LICENSE
      - SECURITY.md
      - src: packaging/macos/Hax.app/Contents/Info.plist
        dst: Hax.app/Contents/Info.plist
        info:
          mode: 0644
      - src: packaging/macos/Hax.app/Contents/MacOS/hax-launcher
        dst: Hax.app/Contents/MacOS/hax-launcher
        info:
          mode: 0755

nfpms:
  - id: packages
    package_name: hax
    vendor: BTCBap
    homepage: https://github.com/BTCBap/hax
    maintainer: "BTCBap <71675475+BTCBap@users.noreply.github.com>"
    description: |-
      Terminal Bitcoin wallet with PSBT, hardware wallet and multisig support.
      Supports mainnet and testnet4.
    license: MIT
    section: utils
    formats: [deb, rpm]
    bindir: /usr/bin
    ids: [hax]
    contents:
      - src: packaging/linux/hax.desktop
        dst: /usr/share/applications/hax.desktop
        file_info:
          mode: 0644

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Keyless Sigstore signature over checksums.txt (GitHub OIDC identity).
signs:
  - cmd: cosign
    # cosign v3 writes a single Sigstore bundle (signature + certificate).
    signature: "${artifact}.sigstore.json"
    artifacts: checksum
    output: true
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# Homebrew tap intentionally disabled until a tap repo exists.
# brews:
#   - repository: { owner: BTCBap, name: homebrew-tap }

release:
  draft: true
  prerelease: auto
