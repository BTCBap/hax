# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: hax

before:
  hooks:
    - go mod tidy -diff
    - go test ./...

builds:
  - id: hax
    main: ./cmd/hax
    binary: hax
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    # Reproducible builds: strip paths, no VCS-dependent timestamps.
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - >-
        -s -w -buildid=
        -X github.com/BTCBap/hax/internal/version.Version={{ .Version }}
        -X github.com/BTCBap/hax/internal/version.Prerelease={{ .Prerelease }}
        -X github.com/BTCBap/hax/internal/version.GitCommit={{ .ShortCommit }}
        -X github.com/BTCBap/hax/internal/version.GitBranch={{ .Branch }}
        -X github.com/BTCBap/hax/internal/version.BuildDate={{ .CommitDate }}

archives:
  - id: default
    ids: [hax]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - SECURITY.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

# SPDX SBOM per archive (requires syft).
sboms:
  - artifacts: archive

# Keyless Sigstore signature over checksums.txt (GitHub OIDC identity).
signs:
  - cmd: cosign
    # cosign v3 writes a single Sigstore bundle (signature + certificate).
    signature: "${artifact}.sigstore.json"
    artifacts: checksum
    output: true
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# Homebrew tap intentionally disabled until a tap repo exists.
# brews:
#   - repository: { owner: BTCBap, name: homebrew-tap }

release:
  draft: true
  prerelease: auto
