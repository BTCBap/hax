name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# A tag must pass the same checks as main before anything is published.
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: go test (race)
        run: go test -race ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the (draft) GitHub release
      id-token: write      # keyless cosign signing + provenance (OIDC)
      attestations: write  # build provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate SBOM
        run: |
          mkdir -p dist/sbom
          found=0
          # goreleaser keeps build output in dist/<build-id>_<os>_<arch>*/.
          while IFS= read -r -d '' bin; do
            name="$(basename "$(dirname "$bin")")"
            go version -m "$bin" > "dist/sbom/${name}.txt"
            found=$((found + 1))
          done < <(find dist -type f \( -name hax -o -name hax.exe \) -print0)
          if [ "$found" -eq 0 ]; then
            echo "::warning::No hax binaries found under dist; SBOM is empty"
          fi
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ./dist/checksums.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: dist/sbom
          retention-days: 30
