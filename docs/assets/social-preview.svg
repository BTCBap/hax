<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">hax social preview</title>
  <desc id="desc">Social preview card for hax, a terminal bitcoin wallet for testnet4 workflows, PSBT signing, multisig, and hotkey-driven control.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26283b"/>
      <stop offset="100%" stop-color="#171926"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect x="56" y="58" width="1168" height="524" rx="18" fill="#2f3249" stroke="#4a4f70" stroke-width="2"/>

  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace">
    <text x="96" y="148" font-size="70" font-weight="700" fill="#f0b06b">hax</text>
    <text x="96" y="196" font-size="26" fill="#c7cde0">terminal bitcoin wallet</text>
    <text x="96" y="256" font-size="24" fill="#f4f5f7">testnet4-first</text>
    <text x="96" y="296" font-size="24" fill="#f4f5f7">PSBT + multisig workflows</text>
    <text x="96" y="336" font-size="24" fill="#f4f5f7">hotkey-driven Bubble Tea UI</text>
    <text x="96" y="376" font-size="24" fill="#f4f5f7">Electrum and Bitcoin Core backends</text>

    <rect x="688" y="106" width="468" height="168" rx="10" fill="none" stroke="#f0b06b" stroke-width="3"/>
    <rect x="688" y="304" width="468" height="208" rx="10" fill="none" stroke="#b6d8ff" stroke-width="3"/>

    <text x="722" y="156" font-size="26" font-weight="700" fill="#f0b06b">Multisig</text>
    <text x="856" y="156" font-size="20" fill="#8690aa">(2-of-3 multisig)</text>
    <circle cx="728" cy="185" r="7" fill="#afebd2"/>
    <text x="748" y="192" font-size="21" fill="#9bc8bf">Synced</text>
    <text x="838" y="192" font-size="19" fill="#717992">· block 127313</text>
    <text x="722" y="236" font-size="22" fill="#7d859d">Balance:</text>
    <text x="843" y="236" font-size="22" font-weight="700" fill="#f7cf91">0.00006640 BTC</text>

    <text x="722" y="354" font-size="26" font-weight="700" fill="#f4f5f7">Hotkeys</text>
    <text x="722" y="400" font-size="20" fill="#f0b06b">r</text>
    <text x="754" y="400" font-size="20" fill="#f4f5f7">Receive</text>
    <text x="722" y="435" font-size="20" fill="#f0b06b">s</text>
    <text x="754" y="435" font-size="20" fill="#f4f5f7">Send</text>
    <text x="722" y="470" font-size="20" fill="#f0b06b">h</text>
    <text x="754" y="470" font-size="20" fill="#f4f5f7">History</text>
    <text x="900" y="400" font-size="20" fill="#f0b06b">u</text>
    <text x="932" y="400" font-size="20" fill="#f4f5f7">UTXOs</text>
    <text x="900" y="435" font-size="20" fill="#f0b06b">t</text>
    <text x="932" y="435" font-size="20" fill="#f4f5f7">Settings</text>
    <text x="900" y="470" font-size="20" fill="#f0b06b">?</text>
    <text x="932" y="470" font-size="20" fill="#f4f5f7">Help</text>
  </g>
